<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Registration</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><a class="back-link" href="index.html">← Back to website</a><main class="auth-card"><div class="section-label">CLIENT PORTAL</div><h1>Create your account</h1><p>Verify your email before accessing client data.</p><form id="registerForm"><label>Full name<input id="name" required maxlength="100" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn full" type="submit">Register & send verification</button><p id="message" class="message" aria-live="polite"></p></form><div class="auth-links"><a href="login.html">Already registered? Sign in</a></div></main><script type="module" src="js/register.js"></script></body></html>
